name: Bug 报告
description: 报告可以复现的功能、界面、同步或构建问题
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除学号、密码、Cookie、课程详情、导出文件、完整请求 URL 和其他个人信息。

        涉及凭据泄露、越权访问、签名材料或可利用安全细节时，请使用[私密安全通告](https://github.com/bakahuiii/BetterBUCT/security/advisories/new)，不要继续填写公开 Issue。
  - type: input
    id: version
    attributes:
      label: BetterBUCT 版本
      description: 填写应用版本或 commit，例如 0.2.26。
      placeholder: 0.2.26
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - Android 真机
        - Android 模拟器
        - 浏览器开发预览
        - 本地构建或测试
        - 其他
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备和系统
      description: Android 真机或模拟器请填写型号和 Android 版本；浏览器可填写浏览器及版本。
      placeholder: Pixel 8 / Android 15
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序列出从启动到出现问题的最小步骤。
      placeholder: |
        1. 打开……
        2. 进入……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的日志或截图
      description: 请删除凭据、Cookie、完整 URL 查询参数、课程详情和其他个人信息。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，确认没有明显重复项。
          required: true
        - label: 我已经删除了所有真实账号、密码、Cookie、导出数据和其他个人信息。
          required: true
        - label: 这不是应当通过私密安全通告报告的漏洞或凭据泄露。
          required: true

