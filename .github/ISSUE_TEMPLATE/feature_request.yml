name: 功能建议
description: 提出与 BetterBUCT 当前范围相符的新功能或改进
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [README](https://github.com/bakahuiii/BetterBUCT/blob/main/README.md) 和 [当前实施状态](https://github.com/bakahuiii/BetterBUCT/blob/main/docs/PROGRESS.md)。建议应描述用户问题和使用场景，不要包含真实校园数据。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么困难？
      placeholder: 作为……，我希望……，因为……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你希望看到的行为、界面或数据流程。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明当前 workaround 或其他实现方式，以及它们为什么不够。
  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options:
        - 课表、成绩或考试
        - 学业进度或校园工具
        - THEOL 作业和在线测试
        - 同步、缓存或提醒
        - Android 界面和无障碍
        - 开发、构建或文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 兼容性和隐私考虑
      description: 是否涉及校园接口、权限、离线使用、数据迁移或敏感信息？
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，确认没有明显重复项。
          required: true
        - label: 我已经阅读当前实施状态，并接受维护者可能因项目范围或校园服务限制而拒绝建议。
          required: true
        - label: 我没有在描述、截图或附件中提交真实校园数据或凭据。
          required: true

